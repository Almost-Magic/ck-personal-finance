[project]
name = "ck-personal-finance"
version = "1.0.0"
description = "CK Personal Finance private money cockpit"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0", "uvicorn[standard]>=0.34.0", "httpx>=0.28.0",
    "pydantic>=2.10.0", "psycopg[binary]>=3.2.0,<4.0.0",
    "python-multipart>=0.0.18", "pypdf>=5.0.0,<6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
docs = ["python-docx>=1.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"public" = "public"
[tool.hatch.build.targets.sdist]
include = ["/app", "/public", "/server.py", "/tests", "/tools", "/pyproject.toml", "/README.md", "/AUTHENTICATION.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
