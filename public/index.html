<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ledger — AI Accountant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container { text-align: center; padding: 2rem; }
        h1 { font-size: 2.5rem; color: #38bdf8; margin-bottom: 0.5rem; }
        .subtitle { font-size: 1.2rem; color: #94a3b8; margin-bottom: 2rem; }
        .status {
            background: #1e293b;
            border-radius: 12px;
            padding: 1.5rem 2rem;
            display: inline-block;
        }
        .status p { color: #10b981; font-size: 1.1rem; }
        .org { margin-top: 2rem; color: #64748b; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>The Ledger</h1>
        <p class="subtitle">AI Accountant</p>
        <div class="status"><p>System Online</p></div>
        <p class="org">Almost Magic Tech Lab</p>
    </div>
</body>
</html>
